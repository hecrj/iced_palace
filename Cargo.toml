[package]
name = "iced_palace"
description = "A royal collection of exquisite widgets and helpers to rule your iced kingdom"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
geometry = ["iced_widget/canvas"]
macros = ["iced_palace_macros"]
webview = [
    "iced_runtime",
    "wry",
    "url",
    # Only used on macOS, where `clear_all_browsing_data` talks to WebKit
    # directly instead of deleting the data directory.
    "dep:block2",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
]

[dependencies]
iced_core.workspace = true
iced_widget.workspace = true
num-traits.workspace = true

iced_palace_macros.workspace = true
iced_palace_macros.optional = true

iced_runtime.workspace = true
iced_runtime.optional = true

rand.workspace = true
rand.features = ["thread_rng"]
rand.optional = true

url.workspace = true
url.optional = true

wry.workspace = true
wry.optional = true

# Used by `clear_all_browsing_data` to clear the WebKit data store directly,
# as macOS webviews all share it no matter the data directory.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
block2.optional = true

objc2-foundation.workspace = true
objc2-foundation.optional = true

objc2-web-kit.workspace = true
objc2-web-kit.optional = true

[workspace]
members = [
  "macros",
  "examples/*",
]

[workspace.package]
version = "0.15.0-dev"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hecrj/iced_palace"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.85"

[workspace.dependencies]
iced_palace = { version = "0.15.0-dev", path = "." }
iced_palace_macros = { version = "0.15.0-dev", path = "./macros" }

iced = "0.15.0-dev"
iced_core = "0.15.0-dev"
iced_runtime = "0.15.0-dev"
iced_widget = "0.15.0-dev"

block2 = "0.6"
num-traits = "0.2"
objc2-foundation = { version = "0.3", features = ["NSDate"] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "WKWebsiteDataStore",
] }
quote = "1"
syn = "2"
url = "2.5"
wry = "0.55"

rand.version = "0.9"
rand.default-features = false

[patch.crates-io]
iced.git = "https://github.com/iced-rs/iced.git"
iced.rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b"

iced_core.git = "https://github.com/iced-rs/iced.git"
iced_core.rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b"

iced_runtime.git = "https://github.com/iced-rs/iced.git"
iced_runtime.rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b"

iced_widget.git = "https://github.com/iced-rs/iced.git"
iced_widget.rev = "ee67bff38b89dafec8a42d1ed6b8c4b9faba817b"

# For testing new bleeding edge iced features
# iced.path = "../../iced"
# iced_core.path = "../../iced/core"
# iced_runtime.path = "../../iced/runtime"
# iced_widget.path = "../../iced/widget"
